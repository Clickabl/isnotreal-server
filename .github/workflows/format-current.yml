name: Format current
on:
  push:
    branches: [format/current]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: true }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx prettier --write apps/api/src/index.ts apps/api/src/runtime.ts apps/web/src/index.ts docs/PRODUCT_DELIVERY_PLAN.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps docs
          git diff --cached --quiet || git commit -m "style: format current product lap"
          git push
