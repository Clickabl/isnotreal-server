name: Prettier integration patch
on:
  push:
    branches: [diagnostics/prettier-integration]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/postgres.integration.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/postgres.integration.test.mjs
          git commit -m "style: format postgres integration test"
          git push
