name: Delivery integration
on:
  push:
    branches: [main]
    paths: [ops/delivery-driver.py]
permissions:
  contents: write
concurrency:
  group: delivery-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/isnotreal_test
      RUN_DB_INTEGRATION: '1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isnotreal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d isnotreal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash ops/ci-postgres-client.sh
      - name: Apply guarded source changes
        run: |
          test -f ops/delivery-driver.py
          python3 ops/delivery-driver.py
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npx prettier --write .
      - run: npm run check
      - name: Commit only verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages db tests ops docs .github/workflows/ci.yml package.json package-lock.json
          git diff --cached --quiet || git commit -m "feat: verified cause publications and usable public website"
          git push origin HEAD:main
      - name: Save inspectable integration checkout
        if: always()
        run: tar --exclude=.git --exclude=.local --exclude=backups -czf /tmp/integration-checkout.tar.gz .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-integration-checkout
          path: /tmp/integration-checkout.tar.gz
          retention-days: 1
