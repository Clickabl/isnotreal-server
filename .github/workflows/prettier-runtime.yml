name: Prettier runtime diagnostic
on:
  push:
    branches: [diagnostics/prettier-runtime]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/migrate.ts apps/api/src/publish.ts apps/api/src/runtime.ts packages/persistence/src/runtime.ts
      - run: git diff -- apps/api/src/migrate.ts apps/api/src/publish.ts apps/api/src/runtime.ts packages/persistence/src/runtime.ts
