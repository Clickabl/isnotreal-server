name: Prettier runtime test
on:
  push:
    branches: [diagnostics/prettier-runtime-test]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: true }
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/runtime.ts apps/api/src/serve.ts tests/postgres.integration.test.mjs README.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps tests README.md
          git diff --cached --quiet || git commit -m "style: format runtime and integration"
          git push
