name: Prettier causes
on:
  push:
    branches: [diagnostics/prettier-causes]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: true }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx prettier --write apps/api/src/index.ts packages/application/src/index.ts packages/protocol/src/index.ts packages/persistence/src/causes.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages
          git diff --cached --quiet || git commit -m "style: format cause stack"
          git push
