name: Format trusted import
on:
  push:
    branches: [format/import-direct]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: true }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx prettier --write packages/persistence/src/campaign-import.ts apps/api/src/admin.ts tests/postgres.integration.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages apps tests ops
          git diff --cached --quiet || git commit -m "style: format trusted import path"
          git push
