name: Domain runtime channel patch
on:
  push:
    branches: [diagnostics/domain-runtime-channel]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Add domain subtree channel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/persistence/src/runtime.ts')
          s = p.read_text()
          old = "  'youtube',\n  'domain',\n];"
          new = "  'youtube',\n  'domain',\n  'domain-subdomains',\n];"
          if old not in s:
              raise SystemExit('channel list pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npx prettier --write packages/persistence/src/runtime.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/runtime.ts
          git commit -m "fix: publish domain subtree channel"
          git push
