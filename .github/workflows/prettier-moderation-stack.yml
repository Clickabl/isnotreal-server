name: Prettier moderation stack
on:
  push:
    branches: [diagnostics/prettier-moderation-stack]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/admin.ts packages/persistence/src/campaign-import.ts packages/persistence/src/membership-review.ts packages/persistence/src/moderation.ts tests/postgres.integration.test.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages tests
          git diff --cached --quiet || git commit -m "style: format moderation stack"
          git push
