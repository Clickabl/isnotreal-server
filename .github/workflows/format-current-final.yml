name: Format current final
on:
  push:
    branches: [format/current-final]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: true }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx prettier --write docs db/migrations/0028_additional_cause_reason_taxonomy.sql
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs db/migrations/0028_additional_cause_reason_taxonomy.sql
          git diff --cached --quiet || git commit -m "style: format current docs and cause taxonomy"
          git push
