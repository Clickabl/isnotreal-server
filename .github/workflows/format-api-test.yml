name: Format api test
on:
  push:
    branches: [format/api-test]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: true }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx prettier --write tests/api.test.mjs packages/persistence/src/runtime.ts db/migrations/0024_cause_scoped_artifacts.sql
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests packages db
          git diff --cached --quiet || git commit -m "style: format cause publication fixes"
          git push
