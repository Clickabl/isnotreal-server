name: Verify complete feedback and UI workflow
on:
  push:
    branches: [quality/ui-feedback-20260922]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/isnotreal_test
      RUN_DB_INTEGRATION: '1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isnotreal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d isnotreal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply checksum-verified local changeset
        shell: bash
        run: |
          set -euo pipefail
          cat .github/quality-part-1 .github/quality-part-2 .github/quality-part-3 > "$RUNNER_TEMP/quality.tar.xz"
          echo "635d1ab4b0ad2d860a13eb9dc6d25402e5563f0a46439bac439bb3bafa50d935  $RUNNER_TEMP/quality.tar.xz" | sha256sum --check
          mkdir "$RUNNER_TEMP/quality-patch"
          tar -xJf "$RUNNER_TEMP/quality.tar.xz" -C "$RUNNER_TEMP/quality-patch"
          python3 "$RUNNER_TEMP/quality-patch/apply.py"
          rm .github/quality-part-* .github/workflows/quality-feedback.yml
      - run: bash ops/ci-postgres-client.sh
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npx prettier --write .
      - name: Preserve complete formatted changeset on verification branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages db tests ops package.json package-lock.json playwright.config.mjs .gitignore .prettierignore .github
          git diff --cached --quiet || git commit -m "feat: complete feedback intake editor inbox and request safeguards"
          git push origin HEAD:quality/ui-feedback-20260922
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-ui-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
