name: Final gate 3
on:
  push:
    branches: [integration/final-gate-3]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/isnotreal_test
      RUN_DB_INTEGRATION: '1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isnotreal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d isnotreal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: true }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm }
      - run: bash ops/ci-postgres-client.sh
      - run: npm ci
      - run: npx prettier --write .
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "style: canonical production formatting"
          git push
      - run: npm run check
      - run: bash ops/ci-ops-smoke.sh
