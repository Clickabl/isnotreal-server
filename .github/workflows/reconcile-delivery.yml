name: Reconcile delivery verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reconcile-delivery.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/isnotreal_test
      RUN_DB_INTEGRATION: '1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isnotreal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d isnotreal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash ops/ci-postgres-client.sh
      - run: npm ci
      - name: Apply locally verified fixture correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/delivery-checks.mjs')
          s=p.read_text()
          s=s.replace("import { startNodeApiRuntime }", "import { publishReasonCatalogVersion } from '../packages/persistence/dist/reason-catalog.js';\nimport { startNodeApiRuntime }")
          old='''  await db.query("INSERT INTO reason_causes(reason_code,cause_id) VALUES('C03',$1)", [otherId]);'''
          new='''  await assert.rejects(
              db.query("INSERT INTO reason_causes(reason_code,cause_id) VALUES('C03',$1)", [otherId]),
              /reason_causes_one_cause_per_reason_uq/,
            );
            await db.query(`INSERT INTO reason_definitions
              (code,label,description,category,default_list,publication_enabled)
              SELECT 'Q01','Synthetic second-cause fact','Test fixture only',category,default_list,true
              FROM reason_definitions WHERE code='C03'`);
            await db.query(`INSERT INTO reason_evidence_requirements
              (reason_code,subject_scope,evidence_mode,validity_mode,public_criteria,exclusion_criteria,
               primary_or_authoritative_required,minimum_evidence_items,reverify_after_days,inheritance_policy)
              SELECT 'Q01',subject_scope,evidence_mode,validity_mode,public_criteria,exclusion_criteria,
               primary_or_authoritative_required,minimum_evidence_items,reverify_after_days,inheritance_policy
              FROM reason_evidence_requirements WHERE reason_code='C03'`);
            await db.query("INSERT INTO reason_causes(reason_code,cause_id) VALUES('Q01',$1)", [otherId]);
            await publishReasonCatalogVersion(db, { notes: 'Synthetic two-cause isolation fixture' });
            await db.query("INSERT INTO assertion_reasons(assertion_id,reason_code) VALUES($1,'Q01')", [
              assertionId,
            ]);'''
          assert old in s, 'Fixture has changed; reconcile before applying'
          s=s.replace(old,new).replace("VALUES($1,'C03',$2)","VALUES($1,'Q01',$2)")
          old='''  const next = await publishCurrentState(db, store, {'''
          new='''  const otherFull = await reader.full('test-isolation', 'domain-subdomains', 'filter');
            assert.deepEqual(otherFull.entries, [['example.com', publicId, ['Q01']]]);
            const firstFull = await reader.full(cause, 'domain-subdomains', 'filter');
            assert.ok(firstFull.entries.every((entry) => !entry[2].includes('Q01')));
            const next = await publishCurrentState(db, store, {'''
          assert old in s
          p.write_text(s.replace(old,new))
          PY
      - run: npx prettier --write tests/delivery-checks.mjs
      - run: npm run check
      - name: Commit only verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/delivery-checks.mjs
          git diff --cached --quiet || git commit -m "test: prove independent cause publications with distinct factual reasons"
          git push origin HEAD:main
